[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

#Acerca del proyecto
[project]
name = "gestor-pacientes"
version = "0.1.0"
description = "Sistema de gestión de pacientes hospitalarios"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Claudia Fernández Ruiz" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
